# pIES - 本地单机部署编排
# 组件: PostgreSQL(事务事实) / Redis(可重建状态) / backend API / worker / web(nginx)
# 数据卷位于 ./data, 容器重建不丢数据；首次启动时由 Compose 自动创建。
#
# Compose 默认使用 compose 文件所在目录的 basename 作为项目名。目录移动或改名后，
# 这会留下旧项目的容器；这些容器仍持有旧宿主机 bind mount，并可能在 Docker 重启时
# 把旧路径下的 data 目录重新创建。固定项目身份，让目录移动后仍由同一套资源管理。
# 源码或 Dockerfile 变化后必须使用 `docker compose up -d --build`；普通 `up` 可能继续
# 使用已有镜像。Compose 只重建配置或镜像发生变化的服务，不会无条件重建全部服务。
name: pies

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${IESPLAN_DB_NAME:-iesplan}
      POSTGRES_USER: ${IESPLAN_DB_USER:-iesplan}
      POSTGRES_PASSWORD: ${IESPLAN_DB_PASSWORD:-iesplan_dev_password}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IESPLAN_DB_USER:-iesplan} -d ${IESPLAN_DB_NAME:-iesplan}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    command: uvicorn iesplan.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      IESPLAN_DB_URL: postgresql+psycopg://${IESPLAN_DB_USER:-iesplan}:${IESPLAN_DB_PASSWORD:-iesplan_dev_password}@postgres:5432/${IESPLAN_DB_NAME:-iesplan}
      IESPLAN_REDIS_URL: redis://redis:6379/0
      IESPLAN_DATA_DIR: /data
      IESPLAN_SECRET_KEY: ${IESPLAN_SECRET_KEY:-dev-only-secret-change-me}
      IESPLAN_APP_URL: http://localhost:8080
    volumes:
      - ./data:/data
    # RR-P2-13: 应用就绪探针(数据库 + 建模命令注册表均可用才算 ready)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    command: python -m iesplan.worker.main
    environment:
      IESPLAN_DB_URL: postgresql+psycopg://${IESPLAN_DB_USER:-iesplan}:${IESPLAN_DB_PASSWORD:-iesplan_dev_password}@postgres:5432/${IESPLAN_DB_NAME:-iesplan}
      IESPLAN_REDIS_URL: redis://redis:6379/0
      IESPLAN_DATA_DIR: /data
      IESPLAN_SECRET_KEY: ${IESPLAN_SECRET_KEY:-dev-only-secret-change-me}
      IESPLAN_APP_URL: http://localhost:8080
      IESPLAN_WORKER_TYPE: compute
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  io_worker:
    build: ./backend
    command: python -m iesplan.worker.main
    environment:
      IESPLAN_DB_URL: postgresql+psycopg://${IESPLAN_DB_USER:-iesplan}:${IESPLAN_DB_PASSWORD:-iesplan_dev_password}@postgres:5432/${IESPLAN_DB_NAME:-iesplan}
      IESPLAN_REDIS_URL: redis://redis:6379/0
      IESPLAN_DATA_DIR: /data
      IESPLAN_SECRET_KEY: ${IESPLAN_SECRET_KEY:-dev-only-secret-change-me}
      IESPLAN_APP_URL: http://localhost:8080
      IESPLAN_WORKER_TYPE: io
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${IESPLAN_PORT:-8080}:80"
    # RR-P2-13: nginx 静态站点健康检查。busybox wget 不支持 -4 且 localhost
    # 在 alpine 中优先解析 ::1(nginx 只监听 IPv4), 故用 127.0.0.1 直连。
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # QA-E2E-01: Playwright 真实用户验收(13.4: 与应用同处 Docker 网络)。
  # 默认不随 compose up 启动; 验收时: docker compose up -d e2e --build
  e2e:
    build:
      context: .
      dockerfile: frontend/tests/e2e/Dockerfile
    environment:
      E2E_APP_URL: http://web:80
      # setup 全局首登改密后的管理员新密码(与 tests/e2e/global-setup.ts 一致)
      E2E_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:-Iesplan-Admin-2026!}
      E2E_RUN_ID: ${E2E_RUN_ID:-}
    volumes:
      - ./frontend/tests/e2e/test-results:/app/e2e/test-results
    depends_on:
      web:
        condition: service_healthy
    profiles:
      - e2e
