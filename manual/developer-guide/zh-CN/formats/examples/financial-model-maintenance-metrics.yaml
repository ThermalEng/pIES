schema: ies.financial-model
schema_version: "1.0.0"
model:
  id: ies.built-in.maintenance_metrics
  revision: 1
  names:
    zh-CN: 维护清单与指标消费样例模型
    en: Maintenance list and metric consumption demo
  description: 合成样例模型：非空维护清单按发生年显式进入应税所得与现金流；输出 ID 刻意不使用 before_tax/after_tax 命名，税前/税后口径由 cashflow.tax_basis 声明，指标由 source 指向已声明现金流
  investor_perspective: project_owner
  required_capabilities:
    - affine
    - piecewise_linear
parameters:
  income_tax_rate:
    type: ratio
    display_name: 所得税率
    unit: "1"
    range: {min: "0", max: "1"}
  depreciation_years:
    type: integer
    display_name: 折旧年限
    unit: "1"
    range: {min: 1, max: 50}
state: []
inputs:
  - id: operating_revenue
    source: materialized_component
    component: period_energy_sale
    unit: CNY
    sign: negative
  - id: operating_cost
    source: materialized_component
    component: period_variable_om
    unit: CNY
    sign: positive
  - id: initial_cost
    source: construction_total
    component: construction_total
    unit: CNY
    sign: positive
  - id: construction_payment
    source: evaluation_confirmation
    component: construction_payment
    unit: CNY
    sign: positive
  - id: maintenance_expense
    source: evaluation_confirmation
    component: maintenance_expenses
    unit: CNY
    sign: positive
relations:
  - id: depreciation
    expression: initial_cost / depreciation_years
    unit: CNY
    kind: intermediate
    active: {from_op_year: 1, to_op_year: depreciation_years}
  - id: taxable_income
    expression: operating_revenue[year] - operating_cost[year] - maintenance_expense[year] - depreciation[year]
    unit: CNY
    kind: intermediate
  - id: income_tax
    expression: max(0, taxable_income[year]) * income_tax_rate
    unit: CNY
    kind: intermediate
  - id: gross_project_flow
    expression: operating_revenue[year] - operating_cost[year] - maintenance_expense[year] - construction_payment[year]
    unit: CNY
    kind: output
  - id: net_project_flow
    expression: gross_project_flow[year] - income_tax[year]
    unit: CNY
    kind: output
outputs:
  - id: gross_project_flow
    kind: series
    unit: CNY
    cashflow: {tax_basis: before_tax}
    description: 所得税前项目净现金流（逐年序列，含建设付款与维护，正=流入）
  - id: net_project_flow
    kind: series
    unit: CNY
    cashflow: {tax_basis: after_tax}
    description: 所得税后项目净现金流（逐年序列）
  - id: gross_discounted_total
    kind: npv
    source: gross_project_flow
    unit: CNY
    description: 税前净现值（按冻结评价期与折现率贴现）
  - id: net_discounted_total
    kind: npv
    source: net_project_flow
    unit: CNY
    description: 税后净现值（按冻结评价期与折现率贴现）
  - id: net_yield_rate
    kind: irr
    source: net_project_flow
    unit: "1"
    description: 税后内部收益率（贴现比例）
  - id: capital_recovery_static
    kind: payback_static
    source: net_project_flow
    unit: year
    description: 税后静态回收期（年，累计首次非负、年内线性插值）
  - id: capital_recovery_discounted
    kind: payback_dynamic
    source: net_project_flow
    unit: year
    description: 税后动态回收期（年，按冻结折现率贴现后同静态规则）
