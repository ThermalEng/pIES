# 合成样例 C 的项目财务配置：选择模型、提供参数值、逐项选择输入绑定。
# 维护清单与建设付款是评价确认来源（evaluation_confirmation），不出现在本文件；
# 它们在生成阶段由第三项直接输入（materialized.evaluation）携带，见 facts-maintenance-metrics.yaml。
schema: ies.finance-overrides
schema_version: "3.0.0"
profile_ref:
  id: cn-north-demo
model_ref:
  id: ies.built-in.maintenance_metrics
  revision: 1
parameters_values:
  income_tax_rate: {value: "0.20", unit: "1"}
  depreciation_years: {value: "10", unit: "1"}
input_bindings:
  operating_revenue:
    - tariff_binding: pv_export_1
  operating_cost:
    - instance: pv_system_1
    - instance: pv_system_2
