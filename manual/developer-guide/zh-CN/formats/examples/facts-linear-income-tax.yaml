# 合成夹具（fixture）：样例 A 的完整非模型输入，不构成新的长期契约文件。
# 各节按对应正式契约的字段形状书写：
#   assembly_fragment —— 装配 YAML 契约的 finance_binding / tariff_bindings 相关节选
#   materialized      —— 第三项直接输入（同次物化事实集合）：冻结评价确认 evaluation（生成阶段由
#                        application 编排从 CalcSnapshot.evaluation 原样放入；提交/快照形状见公共契约）、
#                        同次求解产生的事实（建设总额，求解前为决策表达式，此处为同次解的事实值）
#                        与已物化财务分量（按 <instance_id>__<分量> / <binding_id>__<分量> 标识，逐财务年）
#   expected          —— 按财务模型契约语义复算的逐年预期与指标（与手算页一致；单位 CNY）
# 复算按五项直接输入消费：模型文件与 Overrides（finance）、本文件 materialized（第三项，含 evaluation）；
# 装配节选与规划配置用于核对绑定与目标引用。
