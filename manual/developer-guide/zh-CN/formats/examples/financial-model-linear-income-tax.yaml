schema: ies.financial-model
schema_version: "1.0.0"
model:
  id: ies.built-in.linear_income_tax
  revision: 1
  names:
    zh-CN: 线性所得税直线折旧模型
    en: Linear income tax with straight-line depreciation
  description: 适用于项目投资口径的简化税后评价模型，采用线性所得税与直线折旧
  investor_perspective: project_equity
  required_capabilities:
    - affine
    - piecewise_linear
parameters:
  income_tax_rate:
    type: ratio
    display_name: 所得税率
    unit: "1"
    range: {min: "0", max: "1"}
  depreciation_years:
    type: integer
    display_name: 折旧年限
    unit: "1"
    range: {min: 1, max: 50}
state: []
inputs:
  - id: operating_revenue
    source: materialized_component
    component: period_energy_sale
    unit: CNY
    sign: negative
  - id: operating_cost
    source: materialized_component
    component: period_variable_om
    unit: CNY
    sign: positive
  - id: initial_cost
    source: construction_total
    component: construction_total
    unit: CNY
    sign: positive
  - id: construction_payment
    source: evaluation_confirmation
    component: construction_payment
    unit: CNY
    sign: positive
relations:
  - id: depreciation
    expression: initial_cost / depreciation_years
    unit: CNY
    kind: intermediate
    active: {from_op_year: 1, to_op_year: depreciation_years}
  - id: taxable_income
    expression: operating_revenue[year] - operating_cost[year] - depreciation[year]
    unit: CNY
    kind: intermediate
  - id: income_tax
    expression: max(0, taxable_income[year]) * income_tax_rate
    unit: CNY
    kind: intermediate
  - id: before_tax_cashflow
    expression: operating_revenue[year] - operating_cost[year] - construction_payment[year]
    unit: CNY
    kind: output
  - id: after_tax_cashflow
    expression: operating_revenue[year] - operating_cost[year] - income_tax[year] - construction_payment[year]
    unit: CNY
    kind: output
outputs:
  - id: before_tax_cashflow
    kind: series
    unit: CNY
    cashflow: {tax_basis: before_tax}
    description: 税前现金流（逐年序列）
  - id: after_tax_cashflow
    kind: series
    unit: CNY
    cashflow: {tax_basis: after_tax}
    description: 税后现金流（逐年序列）
  - id: before_tax_npv
    kind: npv
    source: before_tax_cashflow
    unit: CNY
    description: 税前净现值（按冻结评价期与折现率贴现）
  - id: after_tax_npv
    kind: npv
    source: after_tax_cashflow
    unit: CNY
    description: 税后净现值（按冻结评价期与折现率贴现）
