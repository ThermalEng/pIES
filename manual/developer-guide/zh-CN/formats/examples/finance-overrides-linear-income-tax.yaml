# 合成样例 A 的项目财务配置：选择模型、提供参数值、逐项选择输入绑定。
# 同类分量选择与显式组合：
#   - operating_revenue 只绑定 pv_export_1（同类存在 pv_export_2，未列入即不参与，不隐式聚合）；
#   - operating_cost 显式列出 pv_system_1 与 pv_system_2 两个同类设备成本分量求和。
# 绑定标识的字段形状见财务 YAML 契约；存在性与分量可得性在装配边界核对（见 facts 夹具的装配节选）。
schema: ies.finance-overrides
schema_version: "3.0.0"
profile_ref:
  id: cn-north-demo
model_ref:
  id: ies.built-in.linear_income_tax
  revision: 1
parameters_values:
  income_tax_rate: {value: "0.25", unit: "1"}
  depreciation_years: {value: "10", unit: "1"}
input_bindings:
  operating_revenue:
    - tariff_binding: pv_export_1
  operating_cost:
    - instance: pv_system_1
    - instance: pv_system_2
