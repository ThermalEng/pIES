# 合成样例 A 的规划配置：显式选择财务模型提供的标量目标 after_tax_npv。
# 系统不提供默认目标；该目标由模型 outputs 的 kind: npv 输出给出，
# 折现率与评价期来自任务提交冻结的 evaluation（discount_rate / construction_period / operation_years）。
objective:
  sense: maximize
  expression: after_tax_npv
variables:
  pv_capacity:
    device_ref: pv_system_1
    parameter: rated_capacity_kwp
    lower_bound: "0"
    upper_bound: "1000"
    unit: kWp
constraints: {}
