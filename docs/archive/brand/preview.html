<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TE-PIES 品牌资产预览</title>
<style>
  :root { font-family: system-ui, "Segoe UI", "Noto Sans SC", sans-serif; color: #1f2630; background: #eef2f6; }
  body { max-width: 880px; margin: auto; padding: 40px 24px; }
  section { margin-bottom: 18px; padding: 24px; border: 1px solid #d8dde4; border-radius: 14px; background: #fff; }
  h1 { margin-top: 0; } h2 { margin: 0 0 18px; font-size: 16px; }
  .row { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .item { display: grid; justify-items: center; gap: 8px; color: #596473; font-size: 12px; }
  .dark { padding: 18px 28px; border-radius: 8px; background: #0e5cad; }
</style>
</head>
<body>
<h1>TE-PIES 正式标志</h1>
<section><h2>彩色与字标组合</h2><div class="row">
  <span class="item"><img src="svg/logo-mark-color.svg" width="64" height="64" alt="TE-PIES 彩色标志" />64 px</span>
  <span class="item"><img src="svg/logo-lockup.svg" width="270" alt="TE-PIES 横排组合" />横排组合</span>
</div></section>
<section><h2>小尺寸单色版</h2><div class="row">
  <span class="item"><img src="svg/logo-mark-mono.svg" width="16" height="16" alt="16 px" />16 px</span>
  <span class="item"><img src="svg/logo-mark-mono.svg" width="24" height="24" alt="24 px" />24 px</span>
  <span class="item"><img src="svg/logo-mark-mono.svg" width="32" height="32" alt="32 px" />32 px</span>
</div></section>
<section><h2>反白版</h2><div class="row"><span class="dark"><img src="svg/logo-mark-white.svg" width="64" height="64" alt="TE-PIES 反白标志" /></span></div></section>
</body>
</html>
