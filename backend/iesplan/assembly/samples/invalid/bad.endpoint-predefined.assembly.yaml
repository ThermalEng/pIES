# 非法样例: 连接端点为 predefined 接口 → ASM-EDGE-011
schema: ies.assembly
schema_version: "1.0.0"

assembly:
  id: bad_endpoint_predefined
  name: 非法端点

project_baseline:
  resolution: 1h
  start_year: 2026
  scenario_mode: single

devices:
  grid:
    definition:
      id: ies.device.grid_connection
    asset_origin: existing
    properties: {}
    predefined_interfaces: {}
  elec_load:
    definition:
      id: ies.device.electric_load
    asset_origin: existing
    properties:
      peak_power_kw:
        value: 100
        unit: kW
    predefined_interfaces:
      electricity_demand:
        mode: data_repeat
        path: data/campus_load.data.csv
connections:
  e_bad:
    from: grid.electricity_import
    to: elec_load.electricity_demand

finance:
  ref:
    kind: relative_file
    path: finance/campus.effective-finance.yaml
  profile_id: cn-north-demo

finance_binding:
  instances:
    grid:
      type: none
    elec_load:
      type: none

tariff_bindings: {}

demand_bindings: {}

planning:
  objective:
    sense: minimize
    expression: "0"
  variables:
    v_struct:
      device_ref: any_device
      parameter: any_param
  constraints: {}

outputs:
  series: []
  metrics: []

extensions: {}
