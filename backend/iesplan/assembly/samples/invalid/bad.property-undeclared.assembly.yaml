# 非法样例: 属性未在模型声明 → ASM-INPUT-006
schema: ies.assembly
schema_version: "6.0.0"

assembly:
  id: bad_property_undeclared
  name: 未声明属性

project_baseline:
  resolution: 1h
  start_year: 2026
  scenario_mode: single

devices:
  hp1:
    definition:
      id: ies.device.heat_pump
    asset_origin: new
    properties:
      rated_heat_kw:
        value: 600
        unit: kW
      price_cny:
        value: 9
        unit: CNY
    predefined_interfaces: {}
connections: {}

finance:
  ref:
    kind: relative_file
    path: finance/campus.effective-finance.yaml
  profile_id: cn-north-demo

finance_binding:
  instances:
    hp1:
      type: none

tariff_bindings: {}

demand_bindings: {}

planning:
  objective:
    sense: minimize
    expression: "0"
  variables:
    v_struct:
      device_ref: any_device
      parameter: any_param
  constraints: {}

outputs:
  series: []
  metrics: []

extensions: {}
