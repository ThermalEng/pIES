# 非法样例: predefined 槽缺显式绑定 → ASM-BIND-001
schema: ies.assembly
schema_version: "6.0.0"

assembly:
  id: bad_predefined_missing
  name: 缺绑定

project_baseline:
  resolution: 1h
  start_year: 2026
  scenario_mode: single

devices:
  pv1:
    definition:
      id: ies.device.pv
    asset_origin: new
    properties:
      rated_capacity_kwp:
        value: 300
        unit: kWp
    predefined_interfaces:
      ambient_temperature:
        mode: constant
        value: 25
connections: {}

finance:
  ref:
    kind: relative_file
    path: finance/campus.effective-finance.yaml
  profile_id: cn-north-demo

finance_binding:
  instances:
    pv1:
      type: none

tariff_bindings: {}

demand_bindings: {}

planning:
  objective:
    sense: minimize
    expression: "0"
  variables: {}
  constraints: {}

outputs:
  series: []
  metrics: []

extensions: {}
