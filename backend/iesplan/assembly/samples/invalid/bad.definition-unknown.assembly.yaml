# 非法样例: 未注册设备 → ASM-REF-002
schema: ies.assembly
schema_version: "2.0.0"

assembly:
  id: bad_definition_unknown
  name: 未知设备

project_baseline:
  resolution: 1h
  leap_year: false
  scenario_mode: single

devices:
  hp1:
    definition:
      id: ies.device.nope
    asset_origin: new
    properties:
      rated_heat_kw:
        value: 600
        unit: kW
    predefined_interfaces: {}
connections: {}

finance:
  ref:
    kind: relative_file
    path: finance/campus.effective-finance.yaml
  profile_id: cn-north-demo

finance_binding:
  instances:
    hp1:
      type: none

tariff_bindings: {}

planning:
  objective:
    sense: minimize
    expression: "0"
  variables:
    v_struct:
      device_ref: any_device
      parameter: any_param
  constraints: {}

outputs:
  series: []
  metrics: []

extensions: {}
