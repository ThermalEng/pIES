# 非法样例: 装配 YAML 携带可执行字段(command)→ ASM-SYN-008
schema: ies.assembly
schema_version: "6.0.0"

assembly:
  id: bad_forbidden
  name: 禁止字段

project_baseline:
  resolution: 1h
  start_year: 2026
  scenario_mode: single

devices:
  hp1:
    definition:
      id: ies.device.heat_pump
    asset_origin: new
    properties:
      rated_heat_kw:
        value: 600
        unit: kW
    predefined_interfaces: {}
    command: "/bin/sh -c solver"
connections: {}

finance:
  ref:
    kind: relative_file
    path: finance/campus.effective-finance.yaml
  profile_id: cn-north-demo

finance_binding:
  instances:
    hp1:
      type: none

tariff_bindings: {}

demand_bindings: {}

planning:
  objective:
    sense: minimize
    expression: "0"
  variables: {}
  constraints: {}

outputs:
  series: []
  metrics: []

extensions: {}
