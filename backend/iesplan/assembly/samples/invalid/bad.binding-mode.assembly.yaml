# 非法样例: 预定义模式非法 → ASM-SYN-005
schema: ies.assembly
schema_version: "2.0.0"

assembly:
  id: bad_binding_mode
  name: 非法模式

project_baseline:
  resolution: 1h
  leap_year: false
  scenario_mode: single

devices:
  elec_load:
    definition:
      id: ies.device.electric_load
    asset_origin: existing
    properties:
      peak_power_kw:
        value: 100
        unit: kW
    predefined_interfaces:
      electricity_demand:
        mode: data_magic
        path: data/campus_load.data.csv
connections: {}

constraints: {}

outputs:
  series: []
  metrics: []

extensions: {}
