# 非法样例: 预定义模式非法 → ASM-SYN-005
schema: ies.assembly
schema_version: "6.0.0"

assembly:
  id: bad_binding_mode
  name: 非法模式

project_baseline:
  resolution: 1h
  start_year: 2026
  scenario_mode: single

devices:
  elec_load:
    definition:
      id: ies.device.electric_load
    asset_origin: existing
    properties:
      peak_power_kw:
        value: 100
        unit: kW
    predefined_interfaces:
      electricity_demand:
        mode: data_magic
        path: data/campus_load.data.csv
connections: {}

finance:
  ref:
    kind: relative_file
    path: finance/campus.effective-finance.yaml
  profile_id: cn-north-demo

finance_binding:
  instances:
    elec_load:
      type: none

tariff_bindings: {}

demand_bindings: {}

planning:
  objective:
    sense: minimize
    expression: "0"
  variables: {}
  constraints: {}

outputs:
  series: []
  metrics: []

extensions: {}
