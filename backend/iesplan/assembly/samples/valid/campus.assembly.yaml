schema: ies.assembly
schema_version: "2.0.0"

assembly:
  id: campus_demo
  name: 园区最小算例

project_baseline:
  resolution: 1h
  leap_year: false
  scenario_mode: single

devices:
  grid:
    definition:
      id: ies.device.grid_connection
    asset_origin: existing
    properties:
      max_import_power_kw:
        value: 800
        unit: kW
      max_export_power_kw:
        value: 200
        unit: kW
    predefined_interfaces: {}
  pv1:
    definition:
      id: ies.device.pv
    asset_origin: new
    properties:
      rated_capacity_kwp:
        value: 300
        unit: kWp
    predefined_interfaces:
      solar_irradiance:
        mode: data_repeat
        path: data/pv_irradiance.data.csv
      ambient_temperature:
        mode: constant
        value: 25
  bat1:
    definition:
      id: ies.device.battery
    asset_origin: new
    properties:
      capacity_kwh:
        value: 400
        unit: kWh
      rated_power_kw:
        value: 200
        unit: kW
    predefined_interfaces: {}
  hp1:
    definition:
      id: ies.device.heat_pump
    asset_origin: new
    properties:
      rated_heat_kw:
        value: 600
        unit: kW
      cop:
        value: 3.5
        unit: "1"
    predefined_interfaces: {}
  elec_load:
    definition:
      id: ies.device.electric_load
    asset_origin: existing
    properties:
      peak_power_kw:
        value: 100
        unit: kW
    predefined_interfaces:
      electricity_demand:
        mode: data_repeat
        path: data/campus_load.data.csv
  heat_load:
    definition:
      id: ies.device.heat_load
    asset_origin: existing
    properties:
      peak_heat_kw:
        value: 150
        unit: kW
    predefined_interfaces:
      heat_demand:
        mode: data_repeat
        path: data/campus_heat.data.csv

connections:
  e_grid_pv:
    from: pv1.electric_out
    to: grid.electricity_export
  e_bat:
    from: grid.electricity_import
    to: bat1.electricity
  e_hp_elec:
    from: grid.electricity_import
    to: hp1.electricity_in
  e_elec_load:
    from: grid.electricity_import
    to: elec_load.electricity_in
  e_heat_load:
    from: hp1.heat_out
    to: heat_load.heat_in

finance:
  ref:
    kind: relative_file
    path: finance/campus.effective-finance.yaml
  profile_id: cn-north-demo

finance_binding:
  instances:
    grid:
      type: none
    pv1:
      type: costed
      finance_type: pv_system
      drivers:
        capacity_kw:
          property: rated_capacity_kwp
        generated_kwh:
          interface: electric_out
          aggregation: integrate_positive
    bat1:
      type: costed
      finance_type: battery_system
      drivers:
        energy_kwh:
          property: capacity_kwh
        cycled_kwh:
          interface: electricity
          aggregation: integrate_positive
    hp1:
      type: costed
      finance_type: heat_pump_system
      drivers:
        heat_kw:
          property: rated_heat_kw
        consumed_kwh:
          interface: electricity_in
          aggregation: integrate_positive
    elec_load:
      type: none
    heat_load:
      type: none

tariff_bindings:
  import_meter:
    price: grid_import
    instance: grid
    interface: electricity_import
    aggregation: integrate_positive
  export_meter:
    price: pv_export
    instance: grid
    interface: electricity_export
    aggregation: integrate_positive

planning:
  objective:
    sense: minimize
    expression: pv1__upfront_capex + 1 year * pv1__annual_fixed_om + pv1__period_variable_om + import_meter__period_energy_purchase
  variables:
    pv_cap:
      device_ref: pv1
      parameter: rated_capacity_kwp
      lower_bound: "0"
      upper_bound: "500"
      unit: kWp
  constraints:
    annual_purchase_cap:
      type: annual_purchase_cost_limit
      expression: "import_meter__period_energy_purchase <= 900000 CNY"

outputs:
  series:
    - grid.electricity_import
  metrics:
    - system.total_energy_cost

extensions: {}
