schema: ies.assembly
schema_version: "2.0.0"

assembly:
  id: campus_demo
  name: 园区最小算例

project_baseline:
  resolution: 1h
  leap_year: false
  scenario_mode: single

devices:
  grid:
    definition:
      id: ies.device.grid_connection
    asset_origin: existing
    properties:
      max_import_power_kw:
        value: 800
        unit: kW
      max_export_power_kw:
        value: 200
        unit: kW
    predefined_interfaces: {}
  pv1:
    definition:
      id: ies.device.pv
    asset_origin: new
    properties:
      rated_capacity_kwp:
        value: 300
        unit: kWp
    predefined_interfaces:
      solar_irradiance:
        mode: data_repeat
        path: data/pv_irradiance.data.csv
      ambient_temperature:
        mode: constant
        value: 25
  bat1:
    definition:
      id: ies.device.battery
    asset_origin: new
    properties:
      capacity_kwh:
        value: 400
        unit: kWh
      rated_power_kw:
        value: 200
        unit: kW
    predefined_interfaces: {}
  hp1:
    definition:
      id: ies.device.heat_pump
    asset_origin: new
    properties:
      rated_heat_kw:
        value: 600
        unit: kW
      cop:
        value: 3.5
        unit: "1"
    predefined_interfaces: {}
  elec_load:
    definition:
      id: ies.device.electric_load
    asset_origin: existing
    properties:
      peak_power_kw:
        value: 100
        unit: kW
    predefined_interfaces:
      electricity_demand:
        mode: data_repeat
        path: data/campus_load.data.csv
  heat_load:
    definition:
      id: ies.device.heat_load
    asset_origin: existing
    properties:
      peak_heat_kw:
        value: 150
        unit: kW
    predefined_interfaces:
      heat_demand:
        mode: data_repeat
        path: data/campus_heat.data.csv

connections:
  e_grid_pv:
    from: pv1.electric_out
    to: grid.electricity_export
  e_bat:
    from: grid.electricity_import
    to: bat1.electricity
  e_hp_elec:
    from: grid.electricity_import
    to: hp1.electricity_in

constraints:
  c1:
    type: ratio
    expr: "hp1.electricity_in <= 0.8 * grid.electricity_import"

outputs:
  series:
    - grid.electricity_import
  metrics:
    - system.total_energy_cost

extensions: {}
