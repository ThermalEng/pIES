schema: ies.device-model
schema_version: "2.0.0"
device:
  id: ies.device.transport_pipe
  names:
    zh-CN: 传输管道
    en-US: Transport Pipeline
properties:
  loss_rate:
    value: 0.02
    unit: "1"
    valid_range:
      minimum: 0
      maximum: 0.5
interfaces:
  heat_in:
    type: in
    carrier: heat
    unit: kW
    valid_range:
      minimum: 0
      maximum: null
  heat_out:
    type: out
    carrier: heat
    unit: kW
    valid_range:
      minimum: 0
      maximum: null
equations:
  variables: {}
  relations:
    - id: loss
      expression: "heat_out[t] = heat_in[t] * (1 - loss_rate)"
