schema: ies.device-model
schema_version: "2.1.0"
device:
  id: ies.device.heat_load
  names:
    zh-CN: 热负荷
    en-US: Heat Load
properties:
  peak_heat_kw:
    value: 0
    unit: kW
    valid_range:
      minimum: 0
      maximum: 10000000
interfaces:
  heat_in:
    type: in
    carrier: heat
    unit: kW
    valid_range:
      minimum: 0
      maximum: null
  heat_demand:
    type: predefined
    carrier: heat
    unit: kW
    valid_range:
      minimum: 0
      maximum: null
equations:
  variables: {}
  relations:
    - id: serve
      expression: "heat_in[t] = heat_demand[t]"
