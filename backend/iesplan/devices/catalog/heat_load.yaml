# 热负荷(数据-周期重复、无状态; 周期曲线数据源为同名标准 csv heat_load.csv, 必选)
schema: ies.device-model
schema_version: "1.0.0"

device:
  id: ies.device.heat_load
  version: "1.1.0"
  names:
    zh-CN: 热负荷
    en-US: Heat Load
  model_method: data_repeat
  stateful: false
  fidelity: medium
  energy_carriers: [heat]
  capabilities: [load, heat_load]

parameters:
  peak_heat_kw:
    value_type: number
    quantity: power
    unit: kW
    required: false
    default: 0
    minimum: 0
    maximum: 10000000
  heat_profile:
    value_type: number
    quantity: ratio
    unit: reference
    required: false
    default: 0
  annual_heat_kwh:
    value_type: number
    quantity: energy
    unit: kWh
    required: false
    default: 0
    minimum: 0
  supply_temp_c:
    value_type: number
    quantity: temperature
    unit: "°C"
    required: false
    default: 70
    minimum: 30
    maximum: 95
  return_temp_c:
    value_type: number
    quantity: temperature
    unit: "°C"
    required: false
    default: 50
    minimum: 10
    maximum: 70

ports:
  heat_in:
    carrier: heat
    direction: in
    quantity: power
    unit: kW
    capacity_parameter: peak_heat_kw

data_inputs:
  h_load:
    value_type: number
    quantity: energy
    unit: kWh
    required: true

states: {}

model_commands:
  load: ies.model-command.load.periodic@1.0.0
  heat_load: ies.model-command.load.periodic@1.0.0

extensions:
  ies.meta:
    help_topic: help.modeling.heat_load
    is_load: true
    param_help:
      peak_heat_kw: help.param.heatload.peak_heat_kw
      heat_profile: help.param.heatload.heat_profile
      annual_heat_kwh: help.param.heatload.annual_heat_kwh
      supply_temp_c: help.param.heatload.supply_temp_c
      return_temp_c: help.param.heatload.return_temp_c
  periods:
    h_load: day
