# 电网连接(机理模型、无状态; 电价默认值自 prices.yaml 引用)
schema: ies.device-model
schema_version: "1.0.0"

device:
  id: ies.device.grid_connection
  version: "1.2.0"
  names:
    zh-CN: 电网连接
    en-US: Grid Connection
  model_method: mechanism
  stateful: false
  fidelity: medium
  energy_carriers: [electric]
  capabilities: [grid_connection, power_balance_node]

parameters:
  max_import_power_kw:
    value_type: number
    quantity: power
    unit: kW
    required: false
    default: 0
    minimum: 0
    maximum: 200000
    optimizable: true
  max_export_power_kw:
    value_type: number
    quantity: power
    unit: kW
    required: false
    default: 0
    minimum: 0
    maximum: 200000
    optimizable: true
  voltage_level_kv:
    value_type: number
    quantity: voltage
    unit: kV
    required: false
    default: 10
    enum: [0.4, 10, 35, 110]
  import_tariff:
    value_type: number
    quantity: currency_per_energy
    unit: CNY/kWh
    required: false
    default: "$price:energy_prices.electricity.import_tariff"
    minimum: 0
  export_tariff:
    value_type: number
    quantity: currency_per_energy
    unit: CNY/kWh
    required: false
    default: "$price:energy_prices.electricity.export_tariff"
    minimum: 0
  demand_charge:
    value_type: number
    quantity: currency_per_power
    unit: CNY/kW·月
    required: false
    default: "$price:energy_prices.electricity.demand_charge"
    minimum: 0

ports:
  electric_out:
    carrier: electric
    direction: out
    quantity: power
    unit: kW
    capacity_parameter: max_import_power_kw

data_inputs: {}

states: {}

model_commands:
  grid_connection: ies.model-command.grid.power_balance@1.0.0
  power_balance_node: ies.model-command.grid.power_balance@1.0.0

extensions:
  ies.meta:
    help_topic: help.modeling.grid_connection
    param_help:
      max_import_power_kw: help.param.grid.max_import_power_kw
      max_export_power_kw: help.param.grid.max_export_power_kw
      voltage_level_kv: help.param.grid.voltage_level_kv
      import_tariff: help.param.grid.import_tariff
      export_tariff: help.param.grid.export_tariff
      demand_charge: help.param.grid.demand_charge
