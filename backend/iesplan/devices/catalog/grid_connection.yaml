schema: ies.device-model
schema_version: "1.0.0"
device:
  id: ies.device.grid_connection
  names:
    zh-CN: 电网连接
    en-US: Grid Connection
properties:
  max_import_power_kw:
    value: 0
    unit: kW
    valid_range:
      minimum: 0
      maximum: 200000
  max_export_power_kw:
    value: 0
    unit: kW
    valid_range:
      minimum: 0
      maximum: 200000
interfaces:
  electricity_import:
    type: out
    carrier: electricity
    unit: kW
    valid_range:
      minimum: 0
      maximum: {property_ref: max_import_power_kw}
  electricity_export:
    type: in
    carrier: electricity
    unit: kW
    valid_range:
      minimum: 0
      maximum: {property_ref: max_export_power_kw}
equations:
  variables: {}
  relations:
    - id: import_export_exclusivity
      expression: "electricity_export[t] * electricity_import[t] = 0"
