schema: ies.device-model
schema_version: "2.0.0"
device:
  id: ies.device.grid_connection
  names:
    zh-CN: 电网连接
    en-US: Grid Connection
properties: {}
interfaces:
  electricity_import:
    type: out
    carrier: electricity
    unit: kW
    valid_range:
      minimum: 0
      maximum: null
  electricity_export:
    type: in
    carrier: electricity
    unit: kW
    valid_range:
      minimum: 0
      maximum: null
equations:
  variables: {}
  relations:
    - id: import_export_exclusivity
      expression: "electricity_import[t] * electricity_export[t] = 0"
