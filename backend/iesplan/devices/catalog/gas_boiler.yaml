schema: ies.device-model
schema_version: "2.0.0"
device:
  id: ies.device.gas_boiler
  names:
    zh-CN: 燃气锅炉
    en-US: Gas Boiler
properties:
  rated_heat_kw:
    value: 500
    unit: kW
    valid_range:
      minimum: 0
      maximum: 1000000
  thermal_efficiency:
    value: 0.9
    unit: "1"
    valid_range:
      minimum: 0.5
      maximum: 1
  lhv_kwh_per_m3:
    value: 9.97
    unit: kWh/m3
    valid_range:
      minimum: 5
      maximum: 20
interfaces:
  gas_in:
    type: in
    carrier: gas
    unit: m3/h
    valid_range:
      minimum: 0
      maximum: null
  heat_out:
    type: out
    carrier: heat
    unit: kW
    valid_range:
      minimum: 0
      maximum: null
equations:
  variables: {}
  relations:
    - id: heat_generation
      expression: "heat_out[t] = gas_in[t] * lhv_kwh_per_m3 * thermal_efficiency"
