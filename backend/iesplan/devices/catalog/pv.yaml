# 光伏(机理模型、无状态)
schema: ies.device-model
schema_version: "1.0.0"

device:
  id: ies.device.pv
  version: "1.4.0"
  names:
    zh-CN: 光伏
    en-US: Photovoltaic (PV)
  model_method: mechanism
  stateful: false
  fidelity: high
  energy_carriers: [solar, electric]
  capabilities: [pv, controllable, optimization_variable]

parameters:
  rated_capacity_kwp:
    value_type: number
    quantity: power
    unit: kWp
    required: false
    default: 0
    minimum: 0
    maximum: 1000000
    optimizable: true
    stock_or_addition: addition
  max_capacity_kwp:
    value_type: number
    quantity: power
    unit: kWp
    required: false
    default: 1000
    minimum: 0
    maximum: 1000000
    stock_or_addition: addition
  efficiency:
    value_type: number
    quantity: ratio
    unit: "-"
    required: false
    default: 0.2
    minimum: 0.05
    maximum: 0.5
  tilt_deg:
    value_type: number
    quantity: angle
    unit: deg
    required: false
    default: 30
    minimum: 0
    maximum: 90
  azimuth_deg:
    value_type: number
    quantity: angle
    unit: deg
    required: false
    default: 180
    minimum: 0
    maximum: 360
  unit_invest_cost:
    value_type: number
    quantity: currency_per_power
    unit: CNY/kWp
    required: false
    default: "$price:device_costs.pv.unit_invest_cost"
    minimum: 0
    stock_or_addition: addition
  lifetime_years:
    value_type: number
    quantity: duration
    unit: a
    required: false
    default: "$price:device_costs.pv.lifetime_years"
    minimum: 1
    maximum: 50

ports:
  solar_in:
    carrier: solar
    direction: in
    quantity: irradiance
    unit: W/m2
  electric_out:
    carrier: electric
    direction: out
    quantity: power
    unit: kW
    capacity_parameter: rated_capacity_kwp

data_inputs:
  ghi:
    value_type: number
    quantity: irradiance
    unit: W/m2
    required: true
  t_ambient:
    value_type: number
    quantity: temperature
    unit: "°C"
    required: true

states: {}

model_commands:
  pv: ies.model-command.pv.generation@1.0.0
  controllable: ies.model-command.pv.generation@1.0.0
  optimization_variable: ies.model-command.pv.generation@1.0.0

extensions:
  ies.meta:
    help_topic: help.modeling.pv
    param_help:
      rated_capacity_kwp: help.param.pv.rated_capacity_kwp
      max_capacity_kwp: help.param.pv.max_capacity_kwp
      efficiency: help.param.pv.efficiency
      tilt_deg: help.param.pv.tilt_deg
      azimuth_deg: help.param.pv.azimuth_deg
      unit_invest_cost: help.param.pv.unit_invest_cost
      lifetime_years: help.param.pv.lifetime_years
