schema: ies.device-model
schema_version: "2.0.0"
device:
  id: ies.device.pv
  names:
    zh-CN: 光伏
    en-US: Photovoltaic (PV)
properties:
  rated_capacity_kwp:
    value: 100
    unit: kWp
    valid_range:
      minimum: 0
      maximum: 1000000
  reference_irradiance:
    value: 1000
    unit: W/m2
    valid_range:
      minimum: 0
      maximum: null
  temp_coeff:
    value: -0.004
    unit: "1"
    valid_range:
      minimum: -0.01
      maximum: 0
interfaces:
  solar_irradiance:
    type: predefined
    source:
      mode: data_repeat
      data_ref: data/solar_irradiance.csv
    carrier: solar
    unit: W/m2
    valid_range:
      minimum: 0
      maximum: 2000
  ambient_temperature:
    type: predefined
    source:
      mode: data_repeat
      data_ref: data/ambient_temperature.csv
    carrier: environment
    unit: "°C"
    valid_range:
      minimum: -50
      maximum: 60
  electric_out:
    type: out
    carrier: electricity
    unit: kW
    valid_range:
      minimum: 0
      maximum: null
equations:
  variables: {}
  relations:
    - id: pv_generation
      expression: "electric_out[t] = rated_capacity_kwp * solar_irradiance[t] / reference_irradiance * (1 + temp_coeff * (ambient_temperature[t] - 25))"
