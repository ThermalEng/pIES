schema: ies.device-model
schema_version: "2.0.0"
device:
  id: ies.device.battery
  names:
    zh-CN: 电池储能
    en-US: Battery Storage
properties:
  capacity_kwh:
    value: 1000
    unit: kWh
    valid_range:
      minimum: 0
      maximum: 10000000
  rated_power_kw:
    value: 500
    unit: kW
    valid_range:
      minimum: 0
      maximum: 1000000
  charge_efficiency:
    value: 0.95
    unit: "1"
    valid_range:
      minimum: 0.5
      maximum: 1
  discharge_efficiency:
    value: 0.95
    unit: "1"
    valid_range:
      minimum: 0.5
      maximum: 1
  initial_soc:
    value: 0.5
    unit: "1"
    valid_range:
      minimum: 0
      maximum: 1
  min_soc:
    value: 0.1
    unit: "1"
    valid_range:
      minimum: 0
      maximum: 0.5
  max_soc:
    value: 0.9
    unit: "1"
    valid_range:
      minimum: 0.5
      maximum: 1
  cycle_life:
    value: 6000
    unit: "1"
    valid_range:
      minimum: 100
      maximum: 20000
interfaces:
  electricity:
    type: bidirectional
    carrier: electricity
    unit: kW
    valid_range:
      minimum: null
      maximum: null
equations:
  variables:
    soc:
      unit: "1"
      valid_range:
        minimum: 0
        maximum: 1
      initial:
        property_ref: initial_soc
    charge:
      unit: kW
      valid_range:
        minimum: 0
        maximum: null
    discharge:
      unit: kW
      valid_range:
        minimum: 0
        maximum: null
  relations:
    - id: power_balance
      expression: "electricity[t] = discharge[t] - charge[t]"
    - id: charge_discharge_exclusivity
      expression: "charge[t] * discharge[t] = 0"
    - id: soc_update
      expression: "soc[t] = soc[t-1] + (charge[t] * charge_efficiency - discharge[t] / discharge_efficiency) * step_duration / capacity_kwh"
