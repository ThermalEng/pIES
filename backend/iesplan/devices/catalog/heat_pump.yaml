# 热泵(机理模型、无状态; COP 为运行参数)
schema: ies.device-model
schema_version: "1.0.0"

device:
  id: ies.device.heat_pump
  version: "1.3.0"
  names:
    zh-CN: 热泵
    en-US: Heat Pump
  model_method: mechanism
  stateful: false
  fidelity: high
  energy_carriers: [electric, heat, cool]
  capabilities: [heat_pump, controllable, dual_hvac, optimization_variable]

parameters:
  rated_heat_kw:
    value_type: number
    quantity: power
    unit: kW
    required: false
    default: 0
    minimum: 0
    maximum: 1000000
    optimizable: true
    stock_or_addition: addition
  max_heat_kw:
    value_type: number
    quantity: power
    unit: kW
    required: false
    default: 1000
    minimum: 0
    maximum: 1000000
    stock_or_addition: addition
  cop:
    value_type: number
    quantity: ratio
    unit: "-"
    required: false
    default: 3.2
    minimum: 2.0
    maximum: 6.5
  cop_profile:
    value_type: number
    quantity: ratio
    unit: reference
    required: false
    default: 0
  source_type:
    value_type: string
    quantity: ratio
    unit: "-"
    required: false
    default: air
    enum: [air, ground, water]
  mode:
    value_type: string
    quantity: ratio
    unit: "-"
    required: false
    default: both
    enum: [heating, cooling, both]
  unit_invest_cost:
    value_type: number
    quantity: currency_per_power
    unit: CNY/kW
    required: false
    default: "$price:device_costs.heat_pump.unit_invest_cost"
    minimum: 0
    stock_or_addition: addition
  lifetime_years:
    value_type: number
    quantity: duration
    unit: a
    required: false
    default: "$price:device_costs.heat_pump.lifetime_years"
    minimum: 1
    maximum: 50

ports:
  electric_in:
    carrier: electric
    direction: in
    quantity: power
    unit: kW
    capacity_parameter: rated_heat_kw
  heat_out:
    carrier: heat
    direction: out
    quantity: power
    unit: kW
    capacity_parameter: rated_heat_kw
  cool_out:
    carrier: cool
    direction: out
    quantity: power
    unit: kW
    capacity_parameter: rated_heat_kw

data_inputs: {}

states: {}

model_commands:
  heat_pump: ies.model-command.heat_pump.operation@1.0.0
  controllable: ies.model-command.heat_pump.operation@1.0.0
  dual_hvac: ies.model-command.heat_pump.operation@1.0.0
  optimization_variable: ies.model-command.heat_pump.operation@1.0.0

extensions:
  ies.meta:
    help_topic: help.modeling.heat_pump
    param_help:
      rated_heat_kw: help.param.heatpump.rated_heat_kw
      max_heat_kw: help.param.heatpump.max_heat_kw
      cop: help.param.heatpump.cop
      cop_profile: help.param.heatpump.cop_profile
      source_type: help.param.heatpump.source_type
      mode: help.param.heatpump.mode
      unit_invest_cost: help.param.heatpump.unit_invest_cost
      lifetime_years: help.param.heatpump.lifetime_years
