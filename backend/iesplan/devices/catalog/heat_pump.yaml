schema: ies.device-model
schema_version: "2.0.0"
device:
  id: ies.device.heat_pump
  names:
    zh-CN: 热泵
    en-US: Heat Pump
properties:
  cop:
    value: 3.2
    unit: "1"
    valid_range:
      minimum: 2.0
      maximum: 6.5
  rated_heat_kw:
    value: 500
    unit: kW
    valid_range:
      minimum: 0
      maximum: 1000000
interfaces:
  electricity_in:
    type: in
    carrier: electricity
    unit: kW
    valid_range:
      minimum: 0
      maximum: null
  heat_out:
    type: out
    carrier: heat
    unit: kW
    valid_range:
      minimum: 0
      maximum: null
equations:
  variables: {}
  relations:
    - id: heat_conversion
      expression: "heat_out[t] = electricity_in[t] * cop"
