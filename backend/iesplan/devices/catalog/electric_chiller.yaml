schema: ies.device-model
schema_version: "2.0.0"
device:
  id: ies.device.electric_chiller
  names:
    zh-CN: 电制冷机
    en-US: Electric Chiller
properties:
  rated_cooling_kw:
    value: 500
    unit: kW
    valid_range:
      minimum: 0
      maximum: 1000000
  cop:
    value: 4.0
    unit: "1"
    valid_range:
      minimum: 1.5
      maximum: 8.0
interfaces:
  electricity_in:
    type: in
    carrier: electricity
    unit: kW
    valid_range:
      minimum: 0
      maximum: null
  cool_out:
    type: out
    carrier: cool
    unit: kW
    valid_range:
      minimum: 0
      maximum: null
equations:
  variables: {}
  relations:
    - id: cooling_generation
      expression: "cool_out[t] = electricity_in[t] * cop"
