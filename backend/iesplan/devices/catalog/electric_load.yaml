# 电负荷(数据-周期重复、无状态; 周期曲线数据源为同名标准 csv electric_load.csv, 必选)
schema: ies.device-model
schema_version: "1.0.0"

device:
  id: ies.device.electric_load
  version: "1.2.0"
  names:
    zh-CN: 电负荷
    en-US: Electric Load
  model_method: data_repeat
  stateful: false
  fidelity: medium
  energy_carriers: [electric]
  capabilities: [load, switchable]

parameters:
  peak_power_kw:
    value_type: number
    quantity: power
    unit: kW
    required: false
    default: 0
    minimum: 0
    maximum: 10000000
  load_profile:
    value_type: number
    quantity: ratio
    unit: reference
    required: false
    default: 0
  annual_energy_kwh:
    value_type: number
    quantity: energy
    unit: kWh
    required: false
    default: 0
    minimum: 0
  is_switchable:
    value_type: boolean
    quantity: ratio
    unit: "-"
    required: false
    default: false

ports:
  electric_in:
    carrier: electric
    direction: in
    quantity: power
    unit: kW
    capacity_parameter: peak_power_kw

data_inputs:
  e_load:
    value_type: number
    quantity: energy
    unit: kWh
    required: true

states: {}

model_commands:
  load: ies.model-command.load.periodic@1.0.0
  switchable: ies.model-command.load.periodic@1.0.0

extensions:
  ies.meta:
    help_topic: help.modeling.electric_load
    is_load: true
    param_help:
      peak_power_kw: help.param.load.peak_power_kw
      load_profile: help.param.load.load_profile
      annual_energy_kwh: help.param.load.annual_energy_kwh
      is_switchable: help.param.load.is_switchable
  periods:
    e_load: day
