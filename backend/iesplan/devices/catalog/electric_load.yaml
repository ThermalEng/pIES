schema: ies.device-model
schema_version: "1.0.0"
device:
  id: ies.device.electric_load
  names:
    zh-CN: 电负荷
    en-US: Electric Load
properties:
  peak_power_kw:
    value: 0
    unit: kW
    valid_range:
      minimum: 0
      maximum: 10000000
interfaces:
  electricity_in:
    type: in
    carrier: electricity
    unit: kW
    valid_range:
      minimum: 0
      maximum: null
  electricity_demand:
    type: predefined
    carrier: electricity
    unit: kW
    valid_range:
      minimum: 0
      maximum: null
equations:
  variables: {}
  relations:
    - id: serve
      expression: "electricity_in[t] = electricity_demand[t]"
