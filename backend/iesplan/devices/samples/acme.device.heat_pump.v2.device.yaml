schema: ies.device-model
schema_version: "2.0.0"
device:
  id: acme.device.heat_pump
  names: {zh-CN: 热泵, en-US: Heat Pump}
properties:
  cop:
    value: 3.2
    unit: "1"
    valid_range: {minimum: 1, maximum: 10}
interfaces:
  electricity_in:
    type: in
    carrier: electricity
    unit: kW
    valid_range: {minimum: 0, maximum: null}
  heat_out:
    type: out
    carrier: heat
    unit: kW
    valid_range: {minimum: 0, maximum: null}
  ambient_temperature:
    type: predefined
    carrier: environment
    unit: "°C"
    valid_range: {minimum: -50, maximum: 60}
    source: {mode: data_predict, data_ref: ambient_temperature_prediction}
equations:
  variables: {}
  relations:
    - id: heat_conversion
      expression: "heat_out[t] = electricity_in[t] * cop"
