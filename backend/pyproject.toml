[project]
name = "iesplan"
version = "0.1.0"
description = "pIES - 综合能源系统规划平台"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "passlib[bcrypt]>=1.7.4",
    "itsdangerous>=2.2",
    "email-validator>=2.2",
    "httpx>=0.27",
    "authlib>=1.3",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["iesplan*"]

[tool.setuptools.package-data]
# RR-P1-01: 设备目录 YAML/CSV 必须进入安装包(全新镜像从 site-packages 加载默认目录)
# 0.5.0: device-model JSON Schema 与合法/非法样例同为包内资源
"iesplan.devices" = [
    "catalog/**/*.yaml",
    "catalog/**/*.csv",
    "schema/*.json",
    "samples/*.yaml",
]
# 0.7.0: ies.assembly JSON Schema 与合法/非法样例同为包内资源
"iesplan.assembly" = [
    "schema/*.json",
    "samples/valid/*.yaml",
    "samples/invalid/*.yaml",
    "samples/data/*.csv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
