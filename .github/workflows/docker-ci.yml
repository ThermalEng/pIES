name: Docker CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Run all standard backend and Chromium tests (otherwise run changed areas)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select affected tests (Docker)
    runs-on: ubuntu-latest
    outputs:
      backend_run: ${{ steps.plan.outputs.backend_run }}
      backend_tests: ${{ steps.plan.outputs.backend_tests }}
      backend_shards: ${{ steps.plan.outputs.backend_shards }}
      browser_run: ${{ steps.plan.outputs.browser_run }}
      browser_specs: ${{ steps.plan.outputs.browser_specs }}
      browser_lanes: ${{ steps.plan.outputs.browser_lanes }}
      browser_shards: ${{ steps.plan.outputs.browser_shards }}
      browser_total: ${{ steps.plan.outputs.browser_total }}
      frontend_run: ${{ steps.plan.outputs.frontend_run }}
      frontend_tests: ${{ steps.plan.outputs.frontend_tests }}
      startup_run: ${{ steps.plan.outputs.startup_run }}
      pg_run: ${{ steps.plan.outputs.pg_run }}
      special_device: ${{ steps.plan.outputs.special_device }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            workflow_dispatch) base="$(git rev-parse HEAD^ 2>/dev/null || true)" ;;
          esac
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}"; then
            printf '__FULL__\0' > "$RUNNER_TEMP/pies-changed.bin"
          else
            git diff --name-only --diff-filter=ACDMRT -z "$base" HEAD > "$RUNNER_TEMP/pies-changed.bin"
          fi

      - name: Select tests and validate selection rules in Docker
        id: plan
        env:
          FULL_SUITE: ${{ inputs.full_suite && 'true' || 'false' }}
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -v "$RUNNER_TEMP:/out" \
            -w /repo python:3.12-alpine \
            python .github/ci/select_tests.py --self-test
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -v "$RUNNER_TEMP:/out" \
            -w /repo python:3.12-alpine \
            python .github/ci/select_tests.py \
              --changed /out/pies-changed.bin \
              --output /out/pies-plan.outputs \
              --full "$FULL_SUITE"
          cat "$RUNNER_TEMP/pies-plan.outputs" >> "$GITHUB_OUTPUT"

  # Matrix jobs run on independent ephemeral runners: no database/data volume
  # is shared, and no round can succeed using a previous round's initialized DB.
  cold_start:
    name: Cold-start ${{ matrix.round }}/3 (Docker)
    needs: select
    if: needs.select.outputs.startup_run == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        round: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify one independent empty database
        env:
          COLD_START_ROUND: ${{ matrix.round }}
        run: bash .github/ci/verify-cold-start.sh "$COLD_START_ROUND"
      - name: Remove isolated cold-start resources
        if: always()
        env:
          COLD_START_ROUND: ${{ matrix.round }}
        run: |
          export COMPOSE_PROJECT_NAME="pies-ci-cold-$COLD_START_ROUND"
          export CI_TEST_DATA_DIR="$RUNNER_TEMP/pies-cold-start-$COLD_START_ROUND"
          docker compose -f docker-compose.yml -f .github/ci/docker-compose.yml \
            down --remove-orphans --rmi local || true

  pg_concurrency:
    name: PostgreSQL concurrent init (Docker)
    needs: select
    if: needs.select.outputs.pg_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prove synchronized two-process init_db and installed triggers
        run: bash .github/ci/verify-pg-init-concurrency.sh

  frontend_logic:
    name: Frontend Logic (Docker)
    needs: select
    if: needs.select.outputs.frontend_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run selected frontend logic tests through shared Docker entry
        env:
          TEST_FILES: ${{ needs.select.outputs.frontend_tests }}
        run: |
          read -r -a tests <<< "$TEST_FILES"
          printf 'Selected frontend tests: %s\n' "${tests[*]}"
          bash .github/ci/test-frontend-logic.sh "${tests[@]}"

  backend:
    name: Backend Pytest lane ${{ matrix.shard.lane }} (Docker)
    needs: select
    if: needs.select.outputs.backend_run == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.backend_shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx for dependency cache
        uses: docker/setup-buildx-action@v3
      - name: Expose GitHub Actions cache runtime
        uses: crazy-max/ghaction-github-runtime@v4
      - name: Build backend test image (read-only remote cache)
        run: |
          docker compose -f docker-compose.yml \
            -f .github/ci/docker-compose-cache-read.yml build backend

      - name: Run selected Pytest tests
        env:
          TEST_FILES: ${{ matrix.shard.tests }}
        run: |
          mkdir -p ci-artifacts/backend
          read -r -a tests <<< "$TEST_FILES"
          printf 'Selected backend tests: %s\n' "${tests[*]}"
          docker compose run --rm --no-deps \
            --volume "$PWD/ci-artifacts/backend:/ci-artifacts" \
            --volume "$PWD/manual:/manual:ro" \
            backend python -m pytest -q -ra "${tests[@]}" \
            --junitxml=/ci-artifacts/pytest.xml

      - name: Upload Pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-lane-${{ matrix.shard.lane }}
          path: ci-artifacts/backend/pytest.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Remove test containers and images
        if: always()
        run: docker compose down --remove-orphans --rmi local

  # Each Playwright lane owns a *separate* runner, Compose project, Postgres,
  # Redis and E2E globalSetup. Never run multiple browser workers against the
  # same seeded database. A single selected spec gets only one lane.
  browser:
    name: Playwright Chromium lane ${{ matrix.shard.lane }}/${{ needs.select.outputs.browser_total }} (Docker)
    needs: select
    if: needs.select.outputs.browser_run == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.browser_shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BROWSER_SPECS: ${{ matrix.shard.tests }}
      BROWSER_LANE: ${{ matrix.shard.lane }}
      BROWSER_TOTAL: ${{ needs.select.outputs.browser_total }}
      SPECIAL_DEVICE: ${{ needs.select.outputs.special_device }}
      CI_DOCKER_CACHE: "true"
      # Only lane 1 exports the shared backend cache, preventing multi-lane
      # writes to the same scope. Other runners only read it.
      CI_DOCKER_CACHE_WRITE: ${{ matrix.shard.lane == 1 && 'true' || 'false' }}
      CI_TEST_DATA_DIR: ${{ github.workspace }}/.pies-ci-browser-${{ github.run_id }}-${{ matrix.shard.lane }}
      COMPOSE_PROJECT_NAME: pies-ci-browser-${{ matrix.shard.lane }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Docker Compose with cache support
        uses: docker/setup-compose-action@v2
      - name: Expose GitHub Actions cache runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and start isolated application
        run: |
          if [[ "$SPECIAL_DEVICE" == "true" ]]; then
            export PIES_EXT_DEVICE_DIR="$PWD/frontend/tests/e2e/device-catalog-external"
            echo "PIES_EXT_DEVICE_DIR=$PIES_EXT_DEVICE_DIR" >> "$GITHUB_ENV"
          fi
          bash .github/ci/start-stack.sh

      - name: Run selected real-browser scenarios
        run: |
          read -r -a specs <<< "$BROWSER_SPECS"
          [[ "${#specs[@]}" -gt 0 ]] || { echo "::error::Browser selected but no specs provided"; exit 1; }
          echo "Playwright lane $BROWSER_LANE/$BROWSER_TOTAL, specs: ${specs[*]}"
          # Selector assigns each complete spec file to exactly one runner.
          # Each isolated deployment keeps a single Playwright worker.
          # No --grep or --shard; the explicit file list is authoritative.
          if [[ "$SPECIAL_DEVICE" == "true" ]]; then
            docker compose -f docker-compose.yml -f .github/ci/docker-compose.yml \
              -f frontend/tests/e2e/docker-compose.ext-device.yml \
              --profile e2e run --rm --build e2e \
              npx playwright test --project=chromium "${specs[@]}"
            # Special-device suite is a separate config/testIgnore override;
            # run it exactly once, only after lane 1's normal spec shard.
            if [[ "$BROWSER_LANE" == "1" ]]; then
              docker compose -f docker-compose.yml -f .github/ci/docker-compose.yml \
                -f frontend/tests/e2e/docker-compose.ext-device.yml \
                --profile e2e run --rm e2e \
                npx playwright test --config playwright.ext-device.config.ts
            fi
          else
            docker compose -f docker-compose.yml -f .github/ci/docker-compose.yml \
              --profile e2e run --rm --build e2e \
              npx playwright test --project=chromium "${specs[@]}"
          fi

      - name: Show application diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f .github/ci/docker-compose.yml ps -a
          docker compose -f docker-compose.yml -f .github/ci/docker-compose.yml \
            logs --no-color --tail=200

      - name: Upload Playwright traces, screenshots and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium-lane-${{ matrix.shard.lane }}
          path: frontend/tests/e2e/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove test containers and images
        if: always()
        run: |
          docker compose -f docker-compose.yml -f .github/ci/docker-compose.yml \
            down --remove-orphans --rmi local

  gate:
    name: CI Gate
    if: always()
    needs: [select, cold_start, pg_concurrency, frontend_logic, backend, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check and tolerate intentional skips
        env:
          SELECT: ${{ needs.select.result }}
          COLD_REQUIRED: ${{ needs.select.outputs.startup_run }}
          COLD_RESULT: ${{ needs.cold_start.result }}
          PG_REQUIRED: ${{ needs.select.outputs.pg_run }}
          PG_RESULT: ${{ needs.pg_concurrency.result }}
          LOGIC_REQUIRED: ${{ needs.select.outputs.frontend_run }}
          LOGIC_RESULT: ${{ needs.frontend_logic.result }}
          BACKEND_REQUIRED: ${{ needs.select.outputs.backend_run }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BROWSER_REQUIRED: ${{ needs.select.outputs.browser_run }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          [[ "$SELECT" == "success" ]] || { echo "::error::Test selection failed: $SELECT"; exit 1; }
          check() {
            local label="$1" needed="$2" state="$3"
            echo "$label required=$needed actual=$state"
            if [[ "$needed" == "true" ]]; then
              [[ "$state" == "success" ]] || { echo "::error::$label did not succeed ($state)"; return 1; }
            else
              [[ "$needed" == "false" && "$state" == "skipped" ]] || {
                echo "::error::$label unexpectedly ran or was not skipped ($needed/$state)"; return 1;
              }
            fi
          }
          # A matrix job has one aggregate needs.*.result: it is success
          # only when all three independent rounds succeed.
          check "Cold-start matrix (all 3)" "$COLD_REQUIRED" "$COLD_RESULT"
          check "PostgreSQL concurrent init" "$PG_REQUIRED" "$PG_RESULT"
          check "Frontend logic" "$LOGIC_REQUIRED" "$LOGIC_RESULT"
          check "Backend Pytest matrix (all shards)" "$BACKEND_REQUIRED" "$BACKEND_RESULT"
          # GitHub's needs.browser.result aggregates the matrix: all selected
          # lanes must succeed, while browser_run=false skips the entire job.
          check "Browser matrix (all selected lanes)" "$BROWSER_REQUIRED" "$BROWSER_RESULT"
          echo "All required jobs passed; intentionally omitted jobs were skipped."

