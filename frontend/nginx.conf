server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 项目包导入可达数百 MB
    client_max_body_size 2g;

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://backend:8000;
        # 保持实际请求的 Host 与端口($http_host 含端口): 非标准端口部署的
        # 合法重定向(如 FastAPI 尾斜杠 307 的 Location)仍回到同一部署,
        # 后端 CSRF Host 推导来源也与浏览器 Origin(含端口)一致。
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 静态资源(带哈希的构建产物):缺失必须 404, 不能回退 index.html
    # (否则旧构建的 chunk 请求会拿到 HTML, 浏览器 MIME 校验失败, 页面永久"加载中")
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 帮助中心(FE-DOC-01): /help/ 是真实目录(manifest.json), 目录请求回退
    # index.html 交给 SPA 路由; manifest.json 必须 404 而非回退 HTML
    location = /help/ {
        try_files $uri /index.html;
    }

    location /help/ {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
