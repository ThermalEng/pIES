# 0.15 首切片外部内容样例: 恒定电负荷(仓库外新增设备)。
#
# - 实际 schema_version 为 2.0.0 (当前解析器只接受 2.0.0; 格式页目标
#   2.1.0 是既有差距, 本样例不宣称 2.1.0 已交付、不引入兼容分支);
# - 稳定 ID 位于内置 ies.device.* 之外, 核心代码/前端/GUI 无该 ID 分支;
# - 仅使用现有公共载能/单位/方程: electricity_in(in) 由属性 rated_demand_kw
#   恒定驱动, 不声明新载能、模板输入或预定义数据源;
# - 运行期经 docker-compose.ext-device.yml 只读挂载到扫描目录新子目录,
#   不写入内置 catalog。
schema: ies.device-model
schema_version: "2.0.0"
device:
  id: acme.device.constant_load
  names:
    zh-CN: 恒定电负荷（外部样例）
    en-US: Constant Electric Load (External Sample)
properties:
  rated_demand_kw:
    value: 50
    unit: kW
    valid_range:
      minimum: 0
      maximum: 100000
interfaces:
  electricity_in:
    type: in
    carrier: electricity
    unit: kW
    valid_range:
      minimum: 0
      maximum: null
equations:
  variables: {}
  relations:
    - id: serve
      expression: "electricity_in[t] = rated_demand_kw"
