[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pies-sdk"
version = "1.2.0"
description = "Standalone computation SDK and plugin runtime contract for pIES"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
pies-plugin-run = "pies_sdk.runner:main"
pies-sdk = "pies_sdk.cli:main"

[tool.setuptools.packages.find]
include = ["pies_sdk*"]

[tool.setuptools.package-data]
"pies_sdk" = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
