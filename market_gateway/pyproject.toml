[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pies-market-gateway"
version = "1.0.0"
description = "Self-hosted stateless OTP and GitHub PR submission gateway for pIES Market"
license = "MPL-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pies-sdk>=1.2.0",
    "pies-market>=1.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
pies-market-gateway = "pies_market_gateway.app:main"

[tool.setuptools.packages.find]
include = ["pies_market_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
